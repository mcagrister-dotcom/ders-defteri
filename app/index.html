<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Muzikurs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="/icon-512.png" width="30" height="30" alt="" />
        <span class="brand-name">Muzikurs</span>
      </div>
    </header>
    <nav class="nav">
      <div class="brand">
        <img class="brand-mark" src="/icon-512.png" width="30" height="30" alt="" />
        <span class="brand-name">Muzikurs</span>
      </div>
      <a href="#/" data-route="dashboard"><span class="ico">◐</span><span>Pano</span></a>
      <a href="#/takvim" data-route="calendar"><span class="ico">▦</span><span>Takvim</span></a>
      <a href="#/ogrenciler" data-route="students"><span class="ico">♪</span><span>Öğrenciler</span></a>
      <a href="#/odemeler" data-route="payments"><span class="ico">₺</span><span>Ödemeler</span></a>
      <a href="#/ayarlar" data-route="settings"><span class="ico">⚙</span><span>Ayarlar</span></a>
    </nav>
    <main id="view" class="view"></main>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modal-form">
      <header class="modal-head">
        <h2 id="modal-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Kapat">✕</button>
      </header>
      <div id="modal-body" class="modal-body"></div>
      <footer class="modal-foot" id="modal-foot"></footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/router.js"></script>
</body>
</html>
